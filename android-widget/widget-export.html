<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOOL QUEST ウィジェット連携</title>
<style>body{margin:0;background:#101110;color:#f3f3ed;font:16px system-ui,sans-serif}main{max-width:560px;margin:auto;padding:32px 20px}h1{font-size:25px;line-height:1.4}small{color:#b2b4a8}section{border:1px solid #55584e;border-radius:12px;padding:20px;margin:22px 0}button,.button{display:block;box-sizing:border-box;width:100%;padding:15px;margin:12px 0;border-radius:8px;border:1px solid #d3d5c6;background:#f9df59;color:#111;font:inherit;text-align:center;text-decoration:none}button:disabled{opacity:.4}.secondary{background:transparent;color:#f3f3ed}pre{white-space:pre-wrap;font:15px ui-monospace,monospace;line-height:1.7}a{color:#f9df59}#error{color:#ff9898}</style></head>
<body><main><small>THE FOOL QUEST / Android</small><h1>サイトの表示値を<br>ウィジェットへ</h1>
<p>TikTok収益と月間目標を、このブラウザのTHE FOOL QUESTから読み取ります。サイトの保存データは変更しません。</p>
<section><pre id="values">読み取り中</pre><p id="error" role="alert"></p><button id="send" disabled>アプリへ連携</button><button id="copy" class="secondary" disabled>連携データをコピー</button></section>
<p>Couponはアプリが中央台帳から直接更新します。TikTokや目標をサイトで変更したら、このページから再度連携してください。</p>
<p><a href="./">THE FOOL QUESTを開く</a></p><small>普段使うサイトと同じブラウザで開いてください。別のサイトURL・ブラウザには保存データが共有されません。</small></main>
<script src="widget-export.js"></script><script>
let snapshot,uri;const $=id=>document.getElementById(id);const money=n=>'¥'+n.toLocaleString('ja-JP');
try{snapshot=FoolQuestExport.readSnapshot(localStorage);uri=FoolQuestExport.toUri(snapshot);$('values').textContent=snapshot.month+'\nTikTok '+money(snapshot.tiktok)+'\n目標 Total '+money(snapshot.goalTotal)+'\n目標 TikTok '+money(snapshot.goalTiktok)+'\n目標 Coupon '+money(snapshot.goalCoupon);$('send').disabled=false;$('copy').disabled=false;}catch(e){$('values').textContent='連携できません';$('error').textContent=e.message;}
$('send').onclick=()=>{const fresh=FoolQuestExport.readSnapshot(localStorage);const u=FoolQuestExport.toUri(fresh);location.href='intent://snapshot?'+u.split('?')[1]+'#Intent;scheme=tfqwidget;package=com.aruno.foolquest.widget;end';};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(FoolQuestExport.toUri(FoolQuestExport.readSnapshot(localStorage)));$('copy').textContent='コピーしました';}catch(e){$('error').textContent='コピーできません。ブラウザの設定を確認してください。';}};
</script></body></html>
