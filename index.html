<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>THE FOOL QUEST</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">

  <style id="portal-fix-20260830">
    /* ===== 上部ロゴ =====
       元画像の黒い余白を画面外へ逃がし、ロゴ本体を横幅いっぱいに見せる */
    .logo-image{
      width:100% !important;
      height:230px !important;
      min-height:230px !important;
      background-size:cover !important;
      background-position:center 58% !important;
      background-repeat:no-repeat !important;
      overflow:visible !important;
      margin:0 auto 8px !important;
    }

    /* ===== 収益表示 =====
       左に項目名、右に「達成額」「/ 目標額」を2段・右揃えで表示。
       フォントサイズと各metric全体の縦幅は変更しない。 */
    .metric-line{
      display:flex !important;
      flex-direction:row !important;
      align-items:flex-start !important;
      justify-content:space-between !important;
      gap:8px !important;
      font-size:16px !important;
      line-height:1.25 !important;
      white-space:nowrap !important;
    }
    .metric-line .metric-label{
      display:block !important;
      flex:0 0 auto !important;
      width:auto !important;
      font-size:16px !important;
      line-height:1.25 !important;
      text-align:left !important;
    }
    .metric-line .metric-values{
      display:flex !important;
      flex:1 1 auto !important;
      min-width:0 !important;
      flex-direction:column !important;
      align-items:flex-end !important;
      justify-content:flex-start !important;
      gap:0 !important;
      width:auto !important;
      font-size:16px !important;
      line-height:1.25 !important;
      text-align:right !important;
    }
    .metric-line .metric-achieved,
    .metric-line .metric-target,
    .metric-line b{
      display:block !important;
      width:100% !important;
      font-size:16px !important;
      line-height:1.25 !important;
      text-align:right !important;
      white-space:nowrap !important;
    }


    /* ===== ゲージ最終仕様 =====
       目標100% = ゲージ幅80%。超過分は残り20%へ伸びる。
       ％はゲージ中央、超過時は右側に炎。 */
    .metric-values{
      padding-right:8px !important; /* 右端に寄りすぎないよう少し内側へ */
      box-sizing:border-box !important;
    }
    .gauge-wrap{
      position:relative !important;
      width:100% !important;
      overflow:visible !important;
    }
    .gauge{
      position:relative !important;
      width:80% !important;
      overflow:hidden !important;
    }
    .gauge-fill{
      background:#1687ff !important;
      background-color:#1687ff !important;
      transition:width .25s ease !important;
    }
    .gauge-percent{
      position:absolute !important;
      inset:0 !important;
      display:flex !important;
      align-items:center !important;
      justify-content:center !important;
      pointer-events:none !important;
      z-index:3 !important;
      font:inherit !important;
      line-height:1 !important;
      color:#fff !important;
      text-align:center !important;
      white-space:nowrap !important;
      text-shadow:
        1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,
        1px 1px #000,-1px -1px #000,1px -1px #000,-1px 1px #000 !important;
    }
    .gauge-flame{
      position:absolute !important;
      left:84% !important;
      right:auto !important;
      top:50% !important;
      transform:translateY(-50%) !important;
      z-index:5 !important;
      font-size:22px !important;
      line-height:1 !important;
      filter:saturate(1.25) contrast(1.05);
    }
    .gauge-flame[hidden]{
      display:none !important;
    }
    /* 旧OVER KILL文字は炎表示に置き換える */
    .over-kill{
      display:none !important;
    }

    @media (max-width:560px){
      .logo-image{
        height:220px !important;
        min-height:220px !important;
        background-size:cover !important;
        background-position:center 58% !important;
      }
      .metric-line,
      .metric-line .metric-label,
      .metric-line .metric-values,
      .metric-line .metric-achieved,
      .metric-line .metric-target,
      .metric-line b{
        font-size:16px !important;
      }
    }
  </style>

</head>
<body>
  <main class="screen">
    <header class="logo-image" aria-label="THE FOOL QUEST"></header>

    <section class="dashboard">
      <article class="status-panel pixel-frame">
        <header class="character-row">
          <button id="open-csv" class="name-command" type="button" aria-label="CSVアップデートを開く">あるの</button>
          <span>Lv <strong id="level">00</strong></span>
        </header>
        <div class="rule"></div>

        <div class="metric" data-metric="total">
          <div class="metric-line">
            <span class="metric-label">Total:</span>
            <span class="metric-values">
              <span class="metric-achieved"><b id="total-value">¥0</b></span>
              <span class="metric-target">/ ¥1,000,000</span>
            </span>
          </div>
          <div class="gauge-wrap" data-gauge="total">
            <div class="gauge">
              <div id="total-bar" class="gauge-fill"></div>
              <span id="total-percent" class="gauge-percent">0.0%</span>
            </div>
            <span id="total-flame" class="gauge-flame" aria-label="目標達成" hidden>🔥</span>
          </div>
          <div id="total-over" class="over-kill">OVER KILL</div>
        </div>
        <div class="metric" data-metric="tiktok">
          <div class="metric-line">
            <span class="metric-label">TikTok:</span>
            <span class="metric-values">
              <span class="metric-achieved"><b id="tiktok-value">¥0</b></span>
              <span class="metric-target">/ ¥500,000</span>
            </span>
          </div>
          <div class="gauge-wrap" data-gauge="tiktok">
            <div class="gauge">
              <div id="tiktok-bar" class="gauge-fill"></div>
              <span id="tiktok-percent" class="gauge-percent">0.0%</span>
            </div>
            <span id="tiktok-flame" class="gauge-flame" aria-label="目標達成" hidden>🔥</span>
          </div>
          <div id="tiktok-over" class="over-kill">OVER KILL</div>
        </div>
        <div class="metric" data-metric="coupon">
          <div class="metric-line">
            <span class="metric-label">Coupon:</span>
            <span class="metric-values">
              <span class="metric-achieved"><b id="coupon-value">¥0</b></span>
              <span class="metric-target">/ ¥500,000</span>
            </span>
          </div>
          <div class="gauge-wrap" data-gauge="coupon">
            <div class="gauge">
              <div id="coupon-bar" class="gauge-fill"></div>
              <span id="coupon-percent" class="gauge-percent">0.0%</span>
            </div>
            <span id="coupon-flame" class="gauge-flame" aria-label="目標達成" hidden>🔥</span>
          </div>
          <div id="coupon-over" class="over-kill">OVER KILL</div>
        </div>
      </article>

      <div class="commands">
        <button id="day-command" class="day-command pixel-frame" type="button" aria-label="14日後の日付">
          <span>▶ Day+14</span><strong id="day14">--/--</strong>
        </button>

        <nav class="link-panel pixel-frame" aria-label="ポータルリンク">
          <a href="https://assets-management-8os.pages.dev" class="command" target="_self">▶ Assets</a>
          <a href="https://winning-url-manager.45kikurage.workers.dev" class="command" target="_self">▶ Win-Link</a>
          <a href="https://the-fool-head.45kikurage.workers.dev" class="command" target="_self">▶ Profit</a>
          <a href="https://coupon-capture.45kikurage.workers.dev" class="command" target="_self">▶ Screen</a>
          <a href="https://45kikurage-rgb.github.io/copy-paste" class="command" target="_self">▶ Auto</a>
          <a href="https://yahoo-framev2.45kikurage.workers.dev" class="command" target="_self">▶ Creator</a>
        </nav>
      </div>
    </section>
  </main>

  <dialog id="csv-dialog" class="csv-dialog">
    <form method="dialog" class="csv-card pixel-frame">
      <header class="csv-title"><span>CSV UPDATE</span><button class="csv-close" value="close" aria-label="閉じる">×</button></header>
      <p>ポイント履歴CSVを選択すると、チャージポイントの合計をTikTokへ反映します。</p>
      <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
      <button id="choose-csv" class="csv-select" type="button">▶ CSVを選択</button>
      <div id="csv-result" class="csv-result">CSVを選択してください</div>
      <button class="csv-done" value="close">閉じる</button>
    </form>
  </dialog>
  <script src="./app.js"></script>

  <script id="coupon-revenue-sync-20260830">
  (() => {
    const REVENUE_API = 'https://winning-url-api.45kikurage.workers.dev';

    const yenToNumber = (value) => {
      const n = Number(String(value ?? '').replace(/[^\d.-]/g, ''));
      return Number.isFinite(n) ? n : 0;
    };

    const yen = (value) => '¥' + Math.round(Number(value) || 0).toLocaleString('ja-JP');

    const setMetric = (name, value, goal) => {
      const numericValue = Math.max(0, Number(value) || 0);
      const valueEl = document.getElementById(name + '-value');
      const barEl = document.getElementById(name + '-bar');
      const percentEl = document.getElementById(name + '-percent');
      const flameEl = document.getElementById(name + '-flame');

      if (valueEl) valueEl.textContent = yen(numericValue);

      const actualPercent = goal > 0 ? (numericValue / goal) * 100 : 0;

      /* ゲージ外枠そのものが従来幅の80%。
         進捗率は通常どおり0〜100%で描画する。 */
      const visualPercent = Math.max(0, Math.min(100, actualPercent));

      if (barEl) barEl.style.width = visualPercent + '%';
      if (percentEl) percentEl.textContent = actualPercent.toFixed(1) + '%';
      if (flameEl) flameEl.hidden = !(numericValue > goal);
    };

    const readTikTok = () => {
      const el = document.getElementById('tiktok-value');
      return yenToNumber(el?.textContent);
    };

    async function syncCouponRevenue() {
      try {
        const res = await fetch(REVENUE_API + '/api/revenue-summary', {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const data = await res.json();
        const rows = Array.isArray(data.revenues) ? data.revenues : [];
        const current = rows.find(row => String(row.month) === String(data.current_month));
        const coupon = Number(current?.amount || 0);
        const tiktok = readTikTok();
        const total = tiktok + coupon;

        setMetric('coupon', coupon, 500000);
        setMetric('total', total, 1000000);

        window.__FOOL_QUEST_COUPON_REVENUE__ = coupon;
      } catch (err) {
        console.error('Coupon revenue sync failed:', err);
      }
    }

    const boot = () => {
      syncCouponRevenue();

      /* app.js がCSV読込後にTikTok値を書き換えた場合も Total を再計算 */
      const tiktokEl = document.getElementById('tiktok-value');
      if (tiktokEl && 'MutationObserver' in window) {
        let timer = null;
        new MutationObserver(() => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            const coupon = Number(window.__FOOL_QUEST_COUPON_REVENUE__ || 0);
            setMetric('total', readTikTok() + coupon, 1000000);
          }, 50);
        }).observe(tiktokEl, { childList: true, characterData: true, subtree: true });
      }

      /* サイトを開いたままでも10分ごとに当月収益を更新 */
      setInterval(syncCouponRevenue, 10 * 60 * 1000);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot, { once: true });
    } else {
      boot();
    }
  })();
  </script>


  <script id="portal-final-display-20260830">
  (() => {
    const GOALS = { total: 1000000, tiktok: 500000, coupon: 500000 };

    const parseMoney = (s) => {
      const n = Number(String(s ?? '').replace(/[^\d.-]/g, ''));
      return Number.isFinite(n) ? n : 0;
    };

    const renderGaugeOnly = (name) => {
      const valueEl = document.getElementById(name + '-value');
      const barEl = document.getElementById(name + '-bar');
      const percentEl = document.getElementById(name + '-percent');
      const flameEl = document.getElementById(name + '-flame');
      const goal = GOALS[name];
      if (!valueEl || !barEl || !percentEl || !flameEl || !goal) return;

      const value = Math.max(0, parseMoney(valueEl.textContent));
      const actualPercent = (value / goal) * 100;
      const visualPercent = Math.max(0, Math.min(100, actualPercent));

      barEl.style.width = visualPercent + '%';
      percentEl.textContent = actualPercent.toFixed(1) + '%';
      flameEl.hidden = !(value > goal);
    };

    const normalizeLevel = () => {
      const el = document.getElementById('level');
      if (!el) return;
      const n = Math.max(0, Math.trunc(Number(String(el.textContent).replace(/\D/g,'')) || 0));
      const next = String(n).padStart(2, '0');
      if (el.textContent !== next) el.textContent = next;
    };

    const bootFinalDisplay = () => {
      normalizeLevel();
      ['total','tiktok','coupon'].forEach(renderGaugeOnly);

      const levelEl = document.getElementById('level');
      if (levelEl && 'MutationObserver' in window) {
        new MutationObserver(normalizeLevel)
          .observe(levelEl, { childList:true, characterData:true, subtree:true });
      }

      ['total','tiktok','coupon'].forEach(name => {
        const el = document.getElementById(name + '-value');
        if (el && 'MutationObserver' in window) {
          new MutationObserver(() => renderGaugeOnly(name))
            .observe(el, { childList:true, characterData:true, subtree:true });
        }
      });

      /* app.js側の初期描画が少し遅れても最終仕様を適用 */
      setTimeout(() => {
        normalizeLevel();
        ['total','tiktok','coupon'].forEach(renderGaugeOnly);
      }, 300);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootFinalDisplay, { once:true });
    } else {
      bootFinalDisplay();
    }
  })();
  </script>

</body>
</html>
