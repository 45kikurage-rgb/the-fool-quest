  <style id="portal-fix-20260830">

       元画像の黒い余白を画面外へ逃がし、ロゴ本体を横幅いっぱいに見せる */

      width:100% !important;

    /* ===== 収益表示 =====
       左に項目名、右に「達成額」「/ 目標額」を2段・右揃えで表示。

      display:block !important;
      flex:0 0 auto !important;
      width:auto !important;
      font-size:16px !important;
      line-height:1.25 !important;
      text-align:left !important;
    }
    .metric-line .metric-values{
      display:flex !important;
      flex:1 1 auto !important;
      min-width:0 !important;
      flex-direction:column !important;
      align-items:flex-end !important;
      justify-content:flex-start !important;
      gap:0 !important;
      width:auto !important;
      font-size:16px !important;
      line-height:1.25 !important;
      text-align:right !important;
    }
    .metric-line .metric-achieved,
    .metric-line .metric-target,
    .metric-line b{
      display:block !important;
      width:100% !important;
      font-size:16px !important;
      line-height:1.25 !important;
      text-align:right !important;
      white-space:nowrap !important;
    }


    /* ===== ゲージ最終仕様 =====
       目標100% = ゲージ幅80%。超過分は残り20%へ伸びる。
       ％はゲージ中央、超過時は右側に炎。 */
    .metric-values{
      padding-right:18px !important; /* 右端に寄りすぎないよう少し内側へ */
      box-sizing:border-box !important;
    }
    .gauge-wrap{
      position:relative !important;
      width:100% !important;
      overflow:visible !important;
    }
    .gauge{
      position:relative !important;
      width:80% !important;
      overflow:hidden !important;
    }
    .gauge-fill{
      background:#1687ff !important;
      background-color:#1687ff !important;
      transition:width .25s ease !important;
    }
    .gauge-percent{
      position:absolute !important;
      inset:0 !important;
      display:flex !important;
      align-items:center !important;
      justify-content:center !important;
      pointer-events:none !important;
      z-index:3 !important;
      font:inherit !important;
      line-height:1 !important;
      color:#fff !important;
      text-align:center !important;
      white-space:nowrap !important;
      text-shadow:
        1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,
        1px 1px #000,-1px -1px #000,1px -1px #000,-1px 1px #000 !important;
    }
    .gauge-flame{
      position:absolute !important;
      left:84% !important;
      right:auto !important;
      top:50% !important;
      transform:translateY(-50%) !important;
      z-index:5 !important;
      font-size:22px !important;
      line-height:1 !important;
      filter:saturate(1.25) contrast(1.05);
    }
    .gauge-flame[hidden]{

    }

  <script id="coupon-revenue-sync-20260830">
  (() => {
    const REVENUE_API = 'https://winning-url-api.45kikurage.workers.dev';

    const yenToNumber = (value) => {
      const n = Number(String(value ?? '').replace(/[^\d.-]/g, ''));
      return Number.isFinite(n) ? n : 0;
    };

    const yen = (value) => '¥' + Math.round(Number(value) || 0).toLocaleString('ja-JP');

    const setMetric = (name, value, goal) => {
      goal = Number(window.__FOOL_QUEST_GOALS__?.[name] || goal);
      const numericValue = Math.max(0, Number(value) || 0);
      const valueEl = document.getElementById(name + '-value');
      const barEl = document.getElementById(name + '-bar');
      const percentEl = document.getElementById(name + '-percent');
      const flameEl = document.getElementById(name + '-flame');

      if (valueEl) valueEl.textContent = yen(numericValue);

      const actualPercent = goal > 0 ? (numericValue / goal) * 100 : 0;

      /* ゲージ外枠そのものが従来幅の80%。
         進捗率は通常どおり0〜100%で描画する。 */
      const visualPercent = Math.max(0, Math.min(100, actualPercent));

      if (barEl) barEl.style.width = visualPercent + '%';
      if (percentEl) {
        percentEl.textContent = actualPercent.toFixed(1) + '%';

        const parts = new Intl.DateTimeFormat('ja-JP', {
          timeZone:'Asia/Tokyo',
          year:'numeric',
          month:'numeric',
          day:'numeric'
        }).formatToParts(new Date());
        const get = type => Number(parts.find(p => p.type === type)?.value || 0);
        const y = get('year'), m = get('month'), d = get('day');
        const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
        const targetByToday = goal * (d / daysInMonth);
        const achievedToday = numericValue >= targetByToday;

        if (barEl) {
          barEl.classList.toggle('pace-ok', achievedToday);
          barEl.classList.toggle('pace-behind', !achievedToday);
        }
        percentEl.classList.remove('pace-ok','pace-behind');
        percentEl.dataset.dailyTarget = String(Math.round(targetByToday));
      }
      if (flameEl) flameEl.hidden = !(numericValue > goal);
    };

    const readTikTok = () => {
      const el = document.getElementById('tiktok-value');
      return yenToNumber(el?.textContent);
    };

    const COUPON_CACHE_KEY = 'foolQuestCouponRevenueLastGood';

    const loadCachedCoupon = () => {
      try {
        const raw = localStorage.getItem(COUPON_CACHE_KEY);
        if (raw === null || raw === '') return null;
        const n = Number(raw);
        return Number.isFinite(n) && n >= 0 ? n : null;
      } catch {
        return null;
      }
    };

    const saveCachedCoupon = (value) => {
      try {
        localStorage.setItem(COUPON_CACHE_KEY, String(value));
      } catch {}
    };

    const applyCouponValue = (coupon) => {
      const safeCoupon = Math.max(0, Number(coupon) || 0);
      const tiktok = readTikTok();
      setMetric('coupon', safeCoupon, 500000);
      setMetric('total', tiktok + safeCoupon, 1000000);
      window.__FOOL_QUEST_COUPON_REVENUE__ = safeCoupon;
    };

    async function syncCouponRevenue() {
      try {
        const res = await fetch(REVENUE_API + '/api/revenue-summary', {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const data = await res.json();
        const rows = Array.isArray(data.revenues) ? data.revenues : [];
        const currentMonth = String(data.current_month || '').trim();

        /* 当月データが見つからない・API応答が不完全な場合は
           0円で上書きせず、前回正常値をそのまま維持する。 */
        if (!currentMonth) throw new Error('current_month missing');

        const current = rows.find(row => String(row?.month || '').trim() === currentMonth);
        if (!current || current.amount === undefined || current.amount === null || current.amount === '') {
          throw new Error('current revenue missing');
        }

        const coupon = Number(current.amount);
        if (!Number.isFinite(coupon) || coupon < 0) {
          throw new Error('invalid current revenue');
        }

        /* ここまで正常なら0円も正規値として反映する。 */
        saveCachedCoupon(coupon);
        applyCouponValue(coupon);
      } catch (err) {
        console.error('Coupon revenue sync failed; keeping last good value:', err);

        /* 画面がまだ0初期値のときだけ、保存済みの正常値を復元する。 */
        const cached = loadCachedCoupon();
        if (cached !== null) {
          const currentShown = yenToNumber(document.getElementById('coupon-value')?.textContent);
          const remembered = Number(window.__FOOL_QUEST_COUPON_REVENUE__);
          if (!Number.isFinite(remembered) || remembered === 0 || currentShown === 0) {
            applyCouponValue(cached);
          }
        }
      }
    }

    const boot = () => {
      const cachedCoupon = loadCachedCoupon();
      if (cachedCoupon !== null) {
        applyCouponValue(cachedCoupon);
      }

      syncCouponRevenue();

      /* app.js がCSV読込後にTikTok値を書き換えた場合も Total を再計算 */
      const tiktokEl = document.getElementById('tiktok-value');
      if (tiktokEl && 'MutationObserver' in window) {
        let timer = null;
        new MutationObserver(() => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            const coupon = Number(window.__FOOL_QUEST_COUPON_REVENUE__ || 0);
            setMetric('total', readTikTok() + coupon, 1000000);
          }, 50);
        }).observe(tiktokEl, { childList: true, characterData: true, subtree: true });
      }

      /* サイトを開いたままでも10分ごとに当月収益を更新 */
      setInterval(syncCouponRevenue, 10 * 60 * 1000);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot, { once: true });
    } else {
      boot();
    }
  })();
  </script>



  <script id="goal-management-script-20260830">
  (() => {
    const KEY = 'foolQuestGoalAmounts';
    const DEFAULTS = { total:1000000, tiktok:500000, coupon:500000 };

    const readGoals = () => {
      try {
        const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
        return {
          total: Number(saved.total) > 0 ? Math.trunc(Number(saved.total)) : DEFAULTS.total,
          tiktok: Number(saved.tiktok) > 0 ? Math.trunc(Number(saved.tiktok)) : DEFAULTS.tiktok,
          coupon: Number(saved.coupon) > 0 ? Math.trunc(Number(saved.coupon)) : DEFAULTS.coupon
        };
      } catch {
        return { ...DEFAULTS };
      }
    };

    const goals = readGoals();
    window.__FOOL_QUEST_GOALS__ = goals;

    const money = n => '¥' + Math.trunc(Number(n) || 0).toLocaleString('ja-JP');

    const currentJstDayInfo = () => {
      const parts = new Intl.DateTimeFormat('ja-JP', {
        timeZone:'Asia/Tokyo',
        year:'numeric',
        month:'numeric',
        day:'numeric'
      }).formatToParts(new Date());

      const get = type => Number(parts.find(p => p.type === type)?.value || 0);
      const year = get('year');
      const month = get('month');
      const day = get('day');
      const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
      return { year, month, day, daysInMonth };
    };

    const applyDailyPaceColor = (percentEl, value, goal) => {
      if (!percentEl || !goal) return;
      const { day, daysInMonth } = currentJstDayInfo();
      const targetByToday = goal * (day / daysInMonth);
      const achieved = Number(value) >= targetByToday;

      const barEl = percentEl.closest('.gauge')?.querySelector('.gauge-fill');
      if (barEl) {
        barEl.classList.toggle('pace-ok', achieved);
        barEl.classList.toggle('pace-behind', !achieved);
      }
      percentEl.classList.remove('pace-ok','pace-behind');
      percentEl.dataset.dailyTarget = String(Math.round(targetByToday));
    };

    const parseMoney = s => {
      const n = Number(String(s ?? '').replace(/[^\d.-]/g,''));
      return Number.isFinite(n) ? n : 0;
    };

    const renderOne = name => {
      const goal = Number(goals[name]) || DEFAULTS[name];
      const target = document.getElementById(name + '-target');
      const valueEl = document.getElementById(name + '-value');
      const bar = document.getElementById(name + '-bar');
      const percent = document.getElementById(name + '-percent');
      const flame = document.getElementById(name + '-flame');

      if (target) target.textContent = '/ ' + money(goal);
      if (!valueEl || !bar || !percent || !flame) return;

      const value = Math.max(0, parseMoney(valueEl.textContent));
      const p = goal > 0 ? value / goal * 100 : 0;
      bar.style.width = Math.max(0, Math.min(100, p)) + '%';
      percent.textContent = p.toFixed(1) + '%';
      applyDailyPaceColor(percent, value, goal);
      flame.hidden = !(value > goal);
    };

    const renderAll = () => ['total','tiktok','coupon'].forEach(renderOne);

    const fillInputs = () => {
      document.getElementById('goal-total-input').value = goals.total;
      document.getElementById('goal-tiktok-input').value = goals.tiktok;
      document.getElementById('goal-coupon-input').value = goals.coupon;
      document.getElementById('goal-manage-message').textContent = '';
    };

    const boot = () => {
      const dialog = document.getElementById('goal-manage-dialog');
      const openBtn = document.getElementById('goal-manage-open');
      const saveBtn = document.getElementById('goal-save-btn');
      const resetBtn = document.getElementById('goal-reset-btn');
      const message = document.getElementById('goal-manage-message');

      renderAll();

      openBtn?.addEventListener('click', () => {
        fillInputs();
        if (dialog?.showModal) dialog.showModal();
        else dialog?.setAttribute('open','');
      });

      saveBtn?.addEventListener('click', () => {
        const next = {
          total: Math.trunc(Number(document.getElementById('goal-total-input').value)),
          tiktok: Math.trunc(Number(document.getElementById('goal-tiktok-input').value)),
          coupon: Math.trunc(Number(document.getElementById('goal-coupon-input').value))
        };

        if (!next.total || next.total < 1 || !next.tiktok || next.tiktok < 1 || !next.coupon || next.coupon < 1) {
          message.textContent = '目標額は1円以上で入力してください';
          return;
        }

        Object.assign(goals, next);
        try { localStorage.setItem(KEY, JSON.stringify(goals)); } catch {}
        renderAll();
        message.textContent = '保存しました ✓';
        setTimeout(() => dialog?.close(), 450);
      });

      resetBtn?.addEventListener('click', () => {
        document.getElementById('goal-total-input').value = DEFAULTS.total;
        document.getElementById('goal-tiktok-input').value = DEFAULTS.tiktok;
        document.getElementById('goal-coupon-input').value = DEFAULTS.coupon;
        message.textContent = '初期値を入力しました';
      });

      /* 金額がAPIやCSVで更新された場合も、新しい目標額で再計算 */
      ['total','tiktok','coupon'].forEach(name => {
        const el = document.getElementById(name + '-value');
        if (el && 'MutationObserver' in window) {
          new MutationObserver(() => renderOne(name))
            .observe(el, { childList:true, characterData:true, subtree:true });
        }
      });

      setTimeout(renderAll, 400);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot, { once:true });
    } else {
      boot();
    }
  })();
  </script>

  <script id="portal-final-display-20260830">
  (() => {
    const GOALS = window.__FOOL_QUEST_GOALS__ || { total: 1000000, tiktok: 500000, coupon: 500000 };
    window.__FOOL_QUEST_GOALS__ = GOALS;

    const parseMoney = (s) => {
      const n = Number(String(s ?? '').replace(/[^\d.-]/g, ''));
      return Number.isFinite(n) ? n : 0;
    };

    const renderGaugeOnly = (name) => {
      const valueEl = document.getElementById(name + '-value');
      const barEl = document.getElementById(name + '-bar');
      const percentEl = document.getElementById(name + '-percent');
      const flameEl = document.getElementById(name + '-flame');
      const goal = Number(window.__FOOL_QUEST_GOALS__?.[name] || GOALS[name]);
      if (!valueEl || !barEl || !percentEl || !flameEl || !goal) return;

      const value = Math.max(0, parseMoney(valueEl.textContent));
      const actualPercent = (value / goal) * 100;
      const visualPercent = Math.max(0, Math.min(100, actualPercent));

      barEl.style.width = visualPercent + '%';
      percentEl.textContent = actualPercent.toFixed(1) + '%';

      const parts = new Intl.DateTimeFormat('ja-JP', {
        timeZone:'Asia/Tokyo',
        year:'numeric',
        month:'numeric',
        day:'numeric'
      }).formatToParts(new Date());
      const get = type => Number(parts.find(p => p.type === type)?.value || 0);
      const y = get('year'), m = get('month'), d = get('day');
      const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const targetByToday = goal * (d / daysInMonth);
      const achievedToday = value >= targetByToday;

      barEl.classList.toggle('pace-ok', achievedToday);
      barEl.classList.toggle('pace-behind', !achievedToday);
      percentEl.classList.remove('pace-ok','pace-behind');
      percentEl.dataset.dailyTarget = String(Math.round(targetByToday));

      flameEl.hidden = !(value > goal);
    };

    const normalizeLevel = () => {
      const el = document.getElementById('level');
      if (!el) return;
      const n = Math.max(0, Math.trunc(Number(String(el.textContent).replace(/\D/g,'')) || 0));
      const next = String(n).padStart(2, '0');
      if (el.textContent !== next) el.textContent = next;
    };

    const bootFinalDisplay = () => {
      normalizeLevel();
      ['total','tiktok','coupon'].forEach(renderGaugeOnly);

      const levelEl = document.getElementById('level');
      if (levelEl && 'MutationObserver' in window) {
        new MutationObserver(normalizeLevel)
          .observe(levelEl, { childList:true, characterData:true, subtree:true });
      }

      ['total','tiktok','coupon'].forEach(name => {
        const el = document.getElementById(name + '-value');
        if (el && 'MutationObserver' in window) {
          new MutationObserver(() => renderGaugeOnly(name))
            .observe(el, { childList:true, characterData:true, subtree:true });
        }
      });

      /* app.js側の初期描画が少し遅れても最終仕様を適用 */
      setTimeout(() => {
        normalizeLevel();
        ['total','tiktok','coupon'].forEach(renderGaugeOnly);
      }, 300);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootFinalDisplay, { once:true });
    } else {
      bootFinalDisplay();
    }
  })();
  </script>
