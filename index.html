<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>THE FOOL QUEST</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20260901-white-mask1">
  <link rel="apple-touch-icon" href="./icon-any-192.png?v=20260901-dragon-icon1">
  <link rel="stylesheet" href="./style.css?v=20260901-dragon-icon1">
</head>
<body>
  <main class="screen">
    <header class="logo-image" aria-label="THE FOOL QUEST"></header>

    <section class="dashboard">
      <div class="overview-grid">
        <article class="status-panel total-panel pixel-frame">
          <header class="character-row">
            <button id="open-csv" class="name-command" type="button" aria-label="CSVアップデートを開く">あるの</button>
            <span>Lv <strong id="level">00</strong></span>
          </header>
          <div class="rule"></div>
          <div id="metric-total"></div>
        </article>

        <div class="top-commands">
          <button class="day-command pixel-frame" type="button" aria-label="14日後と5日後の日付">
            <span class="date-command-row"><span>▶ ＋14</span><strong id="day14">--/--</strong></span>
            <span class="date-command-row"><span>　＋ 5</span><strong id="day5">--/--</strong></span>
          </button>
          <button id="goal-manage-open" class="manage-command pixel-frame" type="button">▶ 管理画面</button>
        </div>
      </div>

      <section class="middle-metrics" aria-label="収益状況">
        <article id="metric-tiktok" class="metric-panel pixel-frame"></article>
        <article id="metric-coupon" class="metric-panel pixel-frame"></article>
      </section>

      <nav class="link-panel pixel-frame" aria-label="ポータルリンク">
        <a href="https://assets-management-8os.pages.dev" class="command" data-link-key="assets"><span class="command-arrow">▶</span><span class="command-copy"><span>ASSET</span><span>MANAGER</span></span></a>
        <a href="https://the-fool-head.45kikurage.workers.dev" class="command" data-link-key="action"><span class="command-arrow">▶</span><span class="command-copy"><span>ACTION</span><span>TOOL</span></span></a>
        <a href="https://45kikurage-rgb.github.io/copy-paste" class="command" data-link-key="text"><span class="command-arrow">▶</span><span class="command-copy"><span>TEXT</span><span>FORMAT</span></span></a>
        <a href="https://winning-url-manager.45kikurage.workers.dev" class="command" data-link-key="win"><span class="command-arrow">▶</span><span class="command-copy"><span>WIN LINK</span><span>MANAGER</span></span></a>
        <a href="https://coupon-capture.45kikurage.workers.dev" class="command" data-link-key="capture"><span class="command-arrow">▶</span><span class="command-copy"><span>URL</span><span>CAPTURE</span></span></a>
        <a href="https://yahoo-framev2.45kikurage.workers.dev" class="command" data-link-key="image"><span class="command-arrow">▶</span><span class="command-copy"><span>IMAGE</span><span>EDITOR</span></span></a>
        <a href="https://lit.link/admin/creator/edit" class="command" data-link-key="summary"><span class="command-arrow">▶</span><span class="command-copy"><span>LINK</span><span>SUMMARY</span></span></a>
      </nav>
    </section>
  </main>

  <dialog id="goal-manage-dialog" class="modal">
    <form method="dialog" class="modal-card pixel-frame">
      <header class="modal-title">
        <span>目標額設定</span>
        <button class="modal-close" value="cancel" aria-label="閉じる">×</button>
      </header>
      <div id="goal-inputs"></div>
      <div id="goal-manage-message" class="goal-message" aria-live="polite"></div>
      <div class="goal-actions">
        <button id="goal-reset-btn" class="secondary" type="button">初期値</button>
        <button class="secondary" value="cancel">キャンセル</button>
        <button id="goal-save-btn" class="primary" type="button">保存</button>
      </div>
      <button id="verification-open" class="wide-button verification-open" type="button">▶ 稼働数検証</button>
       <button id="link-manage-open" class="wide-button link-manage-open" type="button">▶ リンク修正</button>
      <section class="history-section" aria-labelledby="history-title">
        <h2 id="history-title">月別収益</h2>
        <div class="history-scroll">
          <table class="history-table">
            <thead><tr><th>月</th><th>Lv</th><th>Total</th><th>TikTok</th><th>Coupon</th><th>状態</th></tr></thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
      </section>
    </form>
  </dialog>

  <dialog id="verification-dialog" class="modal verification-dialog">
    <form method="dialog" class="verification-card">
      <header class="verification-header">
        <button id="verification-back" class="verification-back" type="button">＜ 管理画面</button>
        <span id="verification-title" tabindex="-1">稼働数検証</span>
        <span aria-hidden="true"></span>
      </header>
      <section class="capacity-section pixel-frame" aria-label="保有台数と1日最大始動台数">
        <label class="capacity-column"><span>保有台数</span><span class="compact-input"><input id="sim-owned" class="numeric-only" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="200" autocomplete="off"><span>台</span></span></label>
        <div class="capacity-column"><span>1日最大始動台数</span><span class="compact-input output-input"><output id="sim-max-starts">8.69</output><span>台</span></span></div>
      </section>

      <section class="verification-section pixel-frame">
        <h2>条件入力</h2>
        <div class="verification-fields">
          <div class="verification-row"><span>稼働日数</span><span class="fixed-value">14 日</span></div>
          <label class="verification-row"><span>1台想定額</span><span class="compact-input"><input id="sim-amount" class="numeric-only" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="2000" autocomplete="off"><span>円</span></span></label>
          <label class="verification-row rest-row"><span>休憩日数</span><span class="compact-input"><input id="sim-rest-days" class="numeric-only" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="9" autocomplete="off"><span>日</span><small id="sim-rest-hours">＝216時間</small></span></label>
          <label class="verification-row"><span>始動台数／日</span><span class="compact-input"><input id="sim-starts" class="numeric-only" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="6" autocomplete="off"><span>台</span></span></label>
        </div>
      </section>

      <section class="verification-results pixel-frame">
        <h2>検証結果</h2>
        <dl>
          <div><dt>1日収益</dt><dd id="sim-daily">¥12,000</dd></div>
          <div><dt>月間収益</dt><dd id="sim-monthly">¥360,000</dd></div>
          <div><dt>最大同時稼働</dt><dd id="sim-max-active">84台</dd></div>
        </dl>
      </section>

      <button id="verification-close" class="wide-button verification-bottom" type="button">▶ 管理画面へ戻る</button>
    </form>
  </dialog>

  <dialog id="link-manage-dialog" class="modal">
    <form method="dialog" class="modal-card pixel-frame link-manage-card">
      <header class="modal-title">
        <span>リンク修正</span>
        <button class="modal-close" value="cancel" aria-label="閉じる">×</button>
      </header>
      <div id="link-inputs" class="link-inputs"></div>
      <div id="link-manage-message" class="goal-message" aria-live="polite"></div>
      <div class="goal-actions">
        <button id="link-reset-btn" class="secondary" type="button">初期値</button>
        <button class="secondary" value="cancel">キャンセル</button>
        <button id="link-save-btn" class="primary" type="button">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="csv-dialog" class="modal csv-dialog">
    <form method="dialog" class="modal-card pixel-frame">
      <header class="modal-title">
        <span>CSV UPDATE</span>
        <button class="modal-close" value="close" aria-label="閉じる">×</button>
      </header>
      <p>ポイント履歴CSVを選択すると、チャージポイントの合計をTikTokへ反映します。</p>
      <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
      <button id="choose-csv" class="wide-button" type="button">▶ CSVを選択</button>
      <div id="csv-result" class="csv-result">CSVを選択してください</div>
      <button class="wide-button" value="close">閉じる</button>
    </form>
  </dialog>

  <script src="./app.js?v=20260901-review3"></script>
</body>
</html>
