name: Aruno-Result pinned Android17 backup acceptance
on:
  push:
    paths: ['requests/result-backup-android17.json']
permissions:
  contents: read
jobs:
  backup-android17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: e8707316316200ecc8c779cca970d2817683ab0e, persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools, log-accepted-android-sdk-licenses: false}
      - name: Build isolated fixture APKs (never distributed)
        env: {SIGNING_STORE_PASSWORD: ci-test-only}
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export SIGNING_STORE="$RUNNER_TEMP/widget-ci.jks"
          keytool -genkeypair -keystore "$SIGNING_STORE" -storepass:env SIGNING_STORE_PASSWORD -keypass:env SIGNING_STORE_PASSWORD -alias foolquestwidget -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI TEST ONLY'
          bash android-widget/scripts/build.sh
          bash android-widget/scripts/build-android-tests.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android17 real SAF, recovery, permission loss and reboot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          disk-size: 8192M
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb install android-widget/build/out/fool-quest-widget-0.1.16.apk
            adb install android-widget/build/android-test/widget-tests.apk
            mkdir -p android-widget/build/backup-results
            timeout 180 adb shell am instrument -w com.aruno.foolquest.widget.next.test/com.aruno.foolquest.widget.next.BackupInstrumentation | tee android-widget/build/backup-results/android17.txt
            grep -q 'PASS .* backup Android checks' android-widget/build/backup-results/android17.txt
            adb reboot
            adb wait-for-device
            timeout 180 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
            timeout 180 adb shell am instrument -w -e mode reboot com.aruno.foolquest.widget.next.test/com.aruno.foolquest.widget.next.BackupInstrumentation | tee android-widget/build/backup-results/reboot.txt
            grep -q 'PASS .* backup Android checks' android-widget/build/backup-results/reboot.txt
      - name: Capture failure context
        if: failure()
        run: |
          mkdir -p android-widget/build/backup-results
          timeout 15 adb logcat -d -v time > android-widget/build/backup-results/logcat.txt || true
          timeout 15 adb shell uiautomator dump /sdcard/backup-ui.xml || true
          timeout 15 adb pull /sdcard/backup-ui.xml android-widget/build/backup-results/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-backup-android17-results
          path: android-widget/build/backup-results/
          retention-days: 14
