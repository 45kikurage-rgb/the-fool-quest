name: Cloudflare existing credential diagnostic
on:
  push:
    branches: ['diagnostic/widget-cloudflare-github-20261013']
    paths: ['.github/workflows/cloudflare-existing-credential-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check existing deployment credential availability without revealing values
        env:
          CF_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ALTERNATE: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_VARIABLE: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          result = {
              "CLOUDFLARE_API_TOKEN_available": bool(os.environ.get("CF_PRIMARY")),
              "CF_API_TOKEN_available": bool(os.environ.get("CF_ALTERNATE")),
              "account_secret_available": bool(os.environ.get("CF_ACCOUNT_SECRET")),
              "account_variable_available": bool(os.environ.get("CF_ACCOUNT_VARIABLE")),
          }
          pathlib.Path("cloudflare-credential-availability.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-existing-credential-availability
          path: cloudflare-credential-availability.json
          retention-days: 2
