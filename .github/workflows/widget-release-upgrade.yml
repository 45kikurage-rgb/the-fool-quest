name: Widget official successor revised-APK upgrade verification
on:
  push:
    paths: ['android-widget/releases/fool-quest-widget-0.1.12.apk', 'android-widget/releases/fool-quest-widget-0.1.13-original.apk', 'android-widget/releases/fool-quest-widget-0.1.13.apk', 'android-widget/releases/manifest.json', 'android-widget/tests/release-upgrade.py', '.github/workflows/widget-release-upgrade.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install APK verification tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify official successor upgrade and legacy preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 android-widget/tests/release-upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-official-successor-v013-revised-upgrade-results
          path: android-widget/build/release-upgrade/
          retention-days: 14
