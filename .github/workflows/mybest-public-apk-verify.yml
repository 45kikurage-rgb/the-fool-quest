name: Verify published Aru-MyBest APK bytes
on:
  push:
    branches: [main]
    paths: ['widget-download.html', 'android-widget/releases/manifest.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify both public distribution origins
        run: |
          set -euo pipefail
          mkdir -p public-verification
          readarray -t fields < <(python3 - <<'PY'
          import json
          j=json.load(open('android-widget/releases/manifest.json'))
          assert j['applicationId']=='com.aruno.foolquest.widget.next'
          assert j['certificateSha256']=='8495f4b4b508ca5b24c2b7fd714b21963f5b1c0275659f434e3e0d9e239c6730'
          print(j['file']); print(j['sha256']); print(j['version']); print(j['versionCode'])
          PY
          )
          FILE="${fields[0]}"; SHA="${fields[1]}"; VERSION="${fields[2]}"; CODE="${fields[3]}"
          test "$(sha256sum "android-widget/releases/$FILE" | cut -d' ' -f1)" = "$SHA"
          urls=(
            "https://45kikurage-rgb.github.io/the-fool-quest"
            "https://the-fool-quest.45kikurage.workers.dev"
          )
          for origin in "${urls[@]}"; do
            passed=false
            for attempt in $(seq 1 12); do
              if curl -fsSL --max-time 25 "$origin/widget-download.html?verify=$GITHUB_SHA" -o public-verification/page.html \
                  && grep -Fq "v$VERSION / code $CODE" public-verification/page.html \
                  && curl -fsSL --max-time 25 "$origin/android-widget/releases/$FILE" -o public-verification/remote.apk \
                  && test "$(sha256sum public-verification/remote.apk | cut -d' ' -f1)" = "$SHA"; then
                passed=true
                break
              fi
              sleep 12
            done
            if [[ "$passed" != true ]]; then
              echo "FAIL: published bytes or page do not match $origin" >&2
              exit 1
            fi
            echo "PASS $origin $FILE $SHA" | tee -a public-verification/summary.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mybest-public-apk-sha-verification
          path: public-verification/summary.txt
          retention-days: 30
